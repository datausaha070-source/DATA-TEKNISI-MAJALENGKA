<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Teknisi Majalengka</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<style>
body{
    background: radial-gradient(circle at top,#1e3a8a,#0f172a);
    font-family: Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    color:white;
}

.box{
    background:#1e293b;
    width:100%;
    max-width:420px;
    padding:40px 25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

h2{
    font-size:26px;
    margin-bottom:10px;
}

.desc{
    font-size:14px;
    margin-bottom:25px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:none;
    background:#334155;
    color:white;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.wa-btn{
    display:block;
    margin-top:20px;
    padding:12px;
    background:#16a34a;
    color:white;
    border-radius:10px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 Login Teknisi Majalengka</h2>

<div class="desc">
Akses khusus member teknisi Majalengka
</div>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Masuk</button>

<a href="https://wa.me/6282319264646?text=Saya%20ingin%20daftar%20akun%20teknisi"
target="_blank" class="wa-btn">
💬 Daftar / Minta Akses
</a>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBrSk6ZyoxvKAEQFFkEHMT-PenWSSsFSdQ",
    authDomain: "ic-reference-teknisi.firebaseapp.com",
    projectId: "ic-reference-teknisi",
    storageBucket: "ic-reference-teknisi.appspot.com",
    messagingSenderId: "376962038194",
    appId: "1:376962038194:web:fa8475c2e097f5e0548cab"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function login(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(email === "" || password === ""){
        alert("Isi email dan password dulu");
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
    .then(()=>{
        window.location.href = "premium.html";
    })
    .catch(()=>{
        alert("Akun tidak ditemukan / password salah");
    });
}
</script>

</body>
</html>
